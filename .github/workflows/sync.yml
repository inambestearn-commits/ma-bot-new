name: GAM Sync v1

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      GAM_CLIENT_EMAIL: ${{ secrets.GAM_CLIENT_EMAIL }}
      GAM_PRIVATE_KEY: ${{ secrets.GAM_PRIVATE_KEY }}
      GAM_NETWORK_CODE: '22862221459'
      BIGQUERY_ENABLED: 'true'
      BIGQUERY_PROJECT_ID: 'adblobex'
      BIGQUERY_DATASET: 'MA_BOT_DATA'
      BIGQUERY_CREDENTIALS_JSON: ${{ secrets.BIGQUERY_CREDENTIALS_JSON }}
      BIGQUERY_LOCATION: 'asia-southeast1'
      PREJOIN_CLEANUP_ENABLED: 'false'
      RETENTION_CLEANUP_ENABLED: 'false'
      SYNC_INTERVAL: '13'
      CONCURRENCY: '5'
      SUBMIT_CONCURRENCY: '16'
      DOWNLOAD_CONCURRENCY: '24'
      POLL_CONCURRENCY: '16'
      REPORT_POLL_INTERVAL: '3'
      REPORT_POLL_TIMEOUT: '300'
      BIGQUERY_LOAD_RETRIES: '8'
      BIGQUERY_LOAD_BASE_DELAY: '2'
      RETENTION_DAYS: '60'
      ERROR_RETENTION_HOURS: '24'
      LOG_DIR: 'logs'
      MCM_EARNINGS_MONTHS: '0'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run sync once
        run: python sync.py --once